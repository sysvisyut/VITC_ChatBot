# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
#
# CI Pipeline for VITC ChatBot
#
# Jobs:
#   lint  — runs ruff against Backend/ (fast, no credentials needed)
#   test  — installs deps and runs the pytest smoke tests
#
# Deliberately excluded from CI:
#   - eval/run_eval.py  (RAGAS evaluation)
#     Reason: the evaluation suite makes real calls to the Gemini API on every
#     question, which burns quota and costs money on every push/PR. It should
#     instead be run manually on a schedule or before releases. See eval/README
#     for instructions.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff on Backend/
        # E/F = pyflakes/pycodestyle errors, W = warnings, I = import order
        # E501: line-too-long — subjective, skip
        # E402: module-level import not at top — intentional in main.py/routers
        #        (logging config must run before importing modules that use loggers)
        run: ruff check Backend/ --select E,F,W,I --ignore E501,E402

  # ── Job 2: Smoke Tests ──────────────────────────────────────────────────────
  test:
    name: Smoke Tests (pytest)
    runs-on: ubuntu-latest
    # Tests talk to real Weaviate + Gemini — credentials come from repo secrets.
    # If the secrets are not set in the repo, this job will fail at startup,
    # which is intentional — it surfaces misconfiguration early.
    env:
      WEAVIATE_URL:      ${{ secrets.WEAVIATE_URL }}
      WEAVIATE_API_KEY:  ${{ secrets.WEAVIATE_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL:      gemini-3.5-flash
      EMBEDDING_MODEL:   sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIM:     "384"
      API_KEY:           ${{ secrets.API_KEY }}
      COLLECTION_NAME:   VIT_docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install system deps (required by camelot-py and sentence-transformers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            libglib2.0-0 \
            libsm6 \
            libxrender1 \
            libxext6 \
            libgl1

      - name: Install Python dependencies (CPU-only torch)
        working-directory: Backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        working-directory: Backend
        run: pytest app/tests/test_smoke.py -v --tb=short
